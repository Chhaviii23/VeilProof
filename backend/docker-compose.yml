version: "3.8"

services:
  backend:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///storage/veilproof_demo.db
      - STAFF_CORS_ORIGINS=https://veilproof.demo.com
      - STAFF_SESSION_SECRET=${STAFF_SESSION_SECRET}
      - KEY_BROKER_KEY=${KEY_BROKER_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRETS_DIR=storage/keys
      - TRACKING_PEPPER_FILE=storage/keys/tracking_pepper.bin
      - KEY_BROKER_PRIVATE_KEY_FILE=storage/keys/broker_private.pem
      - KEY_BROKER_PUBLIC_KEY_FILE=storage/keys/broker_public.pem
      - STAFF_SESSION_SECRET_FILE=storage/keys/session_secret.bin
    volumes:
      - storage_volume:/app/storage

volumes:
  storage_volume:
