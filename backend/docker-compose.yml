services:
  backend:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: &backend-environment
      APP_ENV: development
      RUN_PROFILE: demo
      DATABASE_URL: sqlite:////app/storage/veilproof_demo.db
      STORAGE_LOCAL_DIR: /app/storage
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8443,http://127.0.0.1:8443}
      SECRETS_DIR: /app/storage/keys
      TRACKING_PEPPER_FILE: /app/storage/keys/tracking_pepper.bin
      KEY_BROKER_PRIVATE_KEY_FILE: /app/storage/keys/broker_private.pem
      KEY_BROKER_PUBLIC_KEY_FILE: /app/storage/keys/broker_public.pem
      STAFF_SESSION_SECRET_FILE: /app/storage/keys/session_secret.bin
    volumes:
      - storage_volume:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
  worker:
    build: .
    env_file:
      - .env
    command: ["python", "-m", "app.worker"]
    environment: *backend-environment
    volumes:
      - storage_volume:/app/storage
    depends_on:
      backend:
        condition: service_healthy
volumes:
  storage_volume:
